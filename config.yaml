# atrium の実験設定（唯一の情報源）．
# mise の各タスク（setup / deploy / start / analyze）と，各ノードで動くコンテナが共通に読む．
# research-cycle は原則としてこのファイルの値を 1 か所だけ変えて実験する（単一レバー原則）．
# 各項目の意味は docs/d0002_configuration.md を参照．

experiment:
  # e0_measure: 実機の性能実測（E0）／ e1_routing: 連合 RAG の実行（E1 以降）
  kind: e1_routing
  # medrag: MIRAGE ＋ MedRAG コーパス ／ feb4rag: FeB4RAG（13 エンジン）
  dataset: medrag
  # ragroute / all / random / none（RAGRoute の 4 方式）
  routing: all
  # snippet_return: 断片返却型 ／ local_answer: 宿る型 ／ retrieval_only: LLM を呼ばず検索まで
  answer_mode: retrieval_only
  # 動作確認用に各データセットの先頭 N 問へ絞る（null で全問）
  question_limit: null
  # 質問者が同時に処理する質問数
  parallel: 4
  # 乱数の種（random ルーティング・学習の分割で使う）
  seed: 12

retrieval:
  # 各データ源（シャードではなくデータ源）から取得する件数（RAGRoute の K）
  k_ret: 50
  # 統合後に LLM へ渡す件数（RAGRoute の K_RERANK）
  k_rerank: 15
  # score: 検索スコアで統合 ／ cross_encoder: bge-reranker-v2-m3 で再ランク ／
  # qrels_oracle: FeB4RAG の結果統合用ラベルの順に並べる（RAGRoute で再ランクを無効にした場合と同じ）
  merge: score
  # medrag ではクエリ埋め込みを質問者がその場で計算する（live）．
  # feb4rag は検索器が 8 種類（5.8B を含む）あるため，中継点で事前計算したものを使う（cached）．
  query_embedding:
    medrag: live
    feb4rag: cached
    enronqa: cached

routing:
  # random で選ぶデータ源の数（RAGRoute: medrag 3 / feb4rag 9）
  random_k:
    medrag: 3
    feb4rag: 9
    enronqa: 2
  # ragroute の判定閾値（RAGRoute の推論コードと同じ 0.5）
  ragroute_threshold: 0.5
  # 公開情報を使う方式（card_sim・term_sketch・centroid_sim・multi_centroid）と flood_score が問い合わせる
  # データ源の数 m（p0004 の RQ-A）．EQ2 で事前登録の規則で選んだ値（results/20261009_eq2_advert_eval）
  top_m:
    enronqa: 2

llm:
  # 各ノードで使う Ollama のバージョン（イメージは制御点の registry の mirror/ から取得する）
  ollama_version: "0.35.1"
  # 断片返却型で回答を生成する質問者側の LLM（Ollama のモデル名）
  requester_model: "llama3.1:8b"
  # 宿る型で各専門家が使う LLM
  expert_model: "qwen3:0.6b"
  # GPU を持つ専門家（wafl500〜509）が宿る型で使う LLM（p0004 の RQ-B．質問者と同じ 8B 級）
  expert_model_gpu: "llama3.1:8b"
  # 生成の上限トークン数と文脈長（Ollama の num_predict / num_ctx）
  num_predict: 2048
  num_ctx: 16384
  # qwen3 系の思考モードを使うか（Ollama の think）
  think: false
  # 生成の温度．0 で貪欲な復号にし，同じ入力に同じ回答を返す（.claude/research/backlog.md の B3）
  temperature: 0.0
  # 質問者の Ollama が同時に処理する要求の数（OLLAMA_NUM_PARALLEL）．8B と文脈長 16384 では 2 件分の
  # KV キャッシュまでが RTX 3060（12 GB）に収まる
  requester_num_parallel: 2
  # 1 回の生成の打ち切り時間（秒）
  timeout_s: 600

local_answer:
  # 宿る型で各専門家が自分のシャードから使う断片数
  k_context: 15
  # 複数の専門家の回答の統合方法（vote: 選択肢の多数決）
  aggregate: vote
  # 1 台の専門家への回答の要求の打ち切り時間（秒）．専門家の Ollama（CPU）は要求を順番に処理するので，
  # experiment.parallel 件の要求が同じ専門家で待つ時間も含む
  timeout_s: 1800

e0:
  # 実測の対象ホスト（GPU なしの専門家の代表）と，RTT・スループットを測る相手
  # MedRAG の配置（先頭の 16 台）で使われない専門家にする．E0 の資材（イメージ・GGUF で約 33 GB）と
  # PubMed のシャード（約 15 GB）を同じ台に置くとディスクが埋まるため．2026-10-06 の E0 は 13.100・13.101 で測った
  hosts: ["192.168.14.108", "192.168.14.109"]
  iperf_pairs: [["192.168.14.108", "192.168.14.109"], ["192.168.14.108", "192.168.13.100"]]
  # llama-bench で測る GGUF（Hugging Face のリポジトリ/ファイル名）
  gguf_models:
    - {name: "qwen3-0.6b", repo: "unsloth/Qwen3-0.6B-GGUF", file: "Qwen3-0.6B-Q4_K_M.gguf"}
    - {name: "qwen3-1.7b", repo: "unsloth/Qwen3-1.7B-GGUF", file: "Qwen3-1.7B-Q4_K_M.gguf"}
    - {name: "qwen3-4b", repo: "unsloth/Qwen3-4B-GGUF", file: "Qwen3-4B-Q4_K_M.gguf"}
    - {name: "qwen3-8b", repo: "unsloth/Qwen3-8B-GGUF", file: "Qwen3-8B-Q4_K_M.gguf"}
  # FAISS（fp16 平坦索引）の検索時間を測るベクトル数
  faiss_vectors: [1000000, 2000000, 3000000]
  faiss_queries: 20

cluster:
  # 制御点：操作端末から `ssh <control>` で入る GPU PC．データ中継点（コーパス取得・埋め込み・
  # ラベル計算・ルーター学習）を兼ね，各ノードへの SSH・イメージ配布・シャード配布もここから行う
  control: wafl-ctrl5
  # 制御点から各ノードへ SSH するユーザー
  ssh_user: denjo
  # 制御点と全ノード（質問者・専門家・GPU PC）で本リポジトリの成果物を置く絶対パス．全ホスト共通で，
  # deploy・start・clean など全てのスクリプトがこの値だけを参照する
  remote_dir: /home/denjo/workspace/ktakahashi/atrium
  # 制御点のデータディレクトリ（atrium.paths の構成）
  data_dir: /home/denjo/atrium-data
  # 制御点のローカル registry のポート．wafl500〜509 には制御点の 127.0.0.1:5000 への SSH 転送
  # （ssh -L 5000:127.0.0.1:5000）が既に張られているので，それを使えるよう 5000 にする
  registry_port: 5000
  # 専門家ノードの HTTP ポート
  node_port: 8100
  # 1 台の専門家に載せる索引の目安（fp16 の埋め込みのバイト数）
  shard_budget_gb: 6.0

  # ── デバイス．1 台のデバイスが持つ役割は 1 つだけで，役割はどのリストに置くかで決まる．
  # 各要素は host（必須）と ssh_user（省略時は上の ssh_user）を持つ．
  # 質問者：ベンチマークの質問を投げ，断片返却型では回答も生成する．制御点（wafl-ctrl5．RTX 3060）が兼ねる．
  # 制御点は本リポジトリの REMOTE_DIR を作業ディレクトリにも使うので，質問者の資材（data/・hf-cache/・ollama/ など）も同じ場所に置かれる
  requester: {host: "wafl-ctrl5"}
  # 質問者の LLM（Ollama）は，cluster.requester_llm を省略して質問者と同じ wafl-ctrl5 の GPU で動かす（p0004 §8.1）
  # 専門家：シャードの検索と宿る型の回答を担う．シャード数だけ先頭から使い，足りなければ巡回して重ねる．
  # 13.x は wafl300〜309，14.x は wafl400〜409（i5-8350U，16 GB，GPU なし）
  experts:
    - {host: "192.168.13.100"}
    - {host: "192.168.13.101"}
    - {host: "192.168.13.102"}
    - {host: "192.168.13.103"}
    - {host: "192.168.13.104"}
    - {host: "192.168.13.105"}
    - {host: "192.168.13.106"}
    - {host: "192.168.13.107"}
    - {host: "192.168.13.108"}
    - {host: "192.168.13.109"}
    - {host: "192.168.14.100"}
    - {host: "192.168.14.101"}
    - {host: "192.168.14.102"}
    - {host: "192.168.14.103"}
    - {host: "192.168.14.104"}
    - {host: "192.168.14.105"}
    - {host: "192.168.14.106"}
    - {host: "192.168.14.107"}
    - {host: "192.168.14.108"}
    - {host: "192.168.14.109"}
  # GPU の専門家（wafl500〜509．RTX 3060）．CPU 20 台の後ろに置くので，先頭からシャード数だけ使う
  # MedRAG（16 台）・FeB4RAG（13 台）の配置は変わらない．EnronQA は 30 台全てを使う（p0004 §8.1）
    - {host: "192.168.15.100"}
    - {host: "192.168.15.101"}
    - {host: "192.168.15.102"}
    - {host: "192.168.15.103"}
    - {host: "192.168.15.104"}
    - {host: "192.168.15.105"}
    - {host: "192.168.15.106"}
    - {host: "192.168.15.107"}
    - {host: "192.168.15.108"}
    - {host: "192.168.15.109"}
  # データ準備で埋め込みを分担する GPU PC（制御点の GPU に加えて使う）．wafl500〜509．
  # experts の GPU の専門家と同じ PC だが，データ準備・実験・採点で時間を分けて使う（docs/d0002 の役割の規則）
  gpu_workers:
    - {host: "192.168.15.100"}
    - {host: "192.168.15.101"}
    - {host: "192.168.15.102"}
    - {host: "192.168.15.103"}
    - {host: "192.168.15.104"}
    - {host: "192.168.15.105"}
    - {host: "192.168.15.106"}
    - {host: "192.168.15.107"}
    - {host: "192.168.15.108"}
    - {host: "192.168.15.109"}

data:
  medrag:
    # 4 データ源（RAGRoute と同じ順序．ルーターの one-hot の順序にもなる）
    sources: [pubmed, statpearls, textbooks, wikipedia]
    article_encoder: "ncbi/MedCPT-Article-Encoder"
    query_encoder: "ncbi/MedCPT-Query-Encoder"
    # RTX 3060（12 GB）で 512 トークンの断片を fp32 で処理しても収まる大きさ
    embed_batch_size: 128
    # 文書とクエリの埋め込みの計算精度（fp32 / fp16_autocast）．fp16_autocast は fp32 の 2.6 倍速く，
    # 上位 15 件の集合の一致率は 97%（.claude/research/backlog.md の B2）
    embed_precision: fp16_autocast
    # 上流のコミットを固定して再現性を保つ
    medrag_commit: "7599a728a28789fd601728c08d313b1148051f41"
    mirage_url: "https://raw.githubusercontent.com/Teddy-XiongGZ/MIRAGE/main/benchmark.json"
    statpearls_url: "https://ftp.ncbi.nlm.nih.gov/pub/litarch/3d/12/statpearls_NBK430685.tar.gz"
    # 自己紹介文（Agent Card の description）．MedRAG 論文の記述に基づく
    descriptions:
      pubmed: "PubMed abstracts: titles and abstracts of biomedical research articles."
      statpearls: "StatPearls: clinical decision support articles for medical professionals."
      textbooks: "Medical textbooks widely used by USMLE examinees (18 books)."
      wikipedia: "General-domain Wikipedia articles."
  feb4rag:
    # RAGRoute と同じ 13 エンジン（signal1m・robust04・trec-news は BEIR で自由に入手できないため除く）
    sources: [arguana, climate-fever, dbpedia-entity, fever, fiqa, hotpotqa, msmarco, nfcorpus, nq, scidocs, scifact, trec-covid, webis-touche2020]
    feb4rag_commit: "b0fe9e19eddac3586fd54d30aebbb5d3d0d72118"
    # BEIR のコーパスの取得元（Hugging Face のデータセット．配布元の zip と同じ内容）
    beir_hf_repo: "BeIR/{name}"
    # 重心の推定に使う文書数（全文書の埋め込みは重いため無作為抽出で近似する）
    centroid_sample: 2000
    # 5.8B の SGPT は CPU で動かすため抽出数を減らす
    centroid_sample_overrides:
      trec-covid: 500
  enronqa:
    # 150 人の受信箱（EnronQA．p0004）．1 個の受信箱が 1 個のデータ源で，順序はルーターの one-hot の順序にもなる
    sources: [allen-p, arnold-j, arora-h, badeer-r, bailey-s, bass-e, baughman-d, beck-s, benson-r, blair-l,
      brawner-s, buy-r, campbell-l, carson-m, cash-m, causholli-m, corman-s, crandell-s, cuilla-m,
      dasovich-j, davis-d, dean-c, delainey-d, derrick-j, dickson-s, donoho-l, donohoe-t, dorland-c, ermis-f,
      farmer-d, fischer-m, forney-j, fossum-d, gang-l, gay-r, geaccone-t, germany-c, gilbertsmith-d, giron-d,
      griffith-j, grigsby-m, guzman-m, haedicke-m, hain-m, harris-s, hayslett-r, heard-m, hendrickson-s,
      hernandez-j, hodge-j, holst-k, horton-s, hyatt-k, hyvl-d, jones-t, kaminski-v, kean-s, keavey-p,
      keiser-k, king-j, kitchen-l, kuykendall-t, lavorato-j, lay-k, lenhart-m, lewis-a, linder-e, lokay-m,
      lokey-t, love-p, lucci-p, maggi-m, mann-k, martin-t, may-l, mccarty-d, mcconnell-m, mckay-b, mckay-j,
      mclaughlin-e, merriss-s, meyers-a, mims-thurston-p, motley-m, neal-s, nemec-g, panus-s, parks-j,
      pereira-s, perlingiere-d, phanis-s, pimenov-v, platter-p, presto-k, quenet-j, quigley-d, rapp-b,
      reitmeyer-j, richey-c, ring-a, ring-r, rodrique-r, rogers-b, ruscitti-k, sager-e, saibi-e, salisbury-h,
      sanchez-m, sanders-r, scholtes-d, schoolcraft-d, schwieger-j, scott-s, semperger-c, shackleton-s,
      shankman-j, shapiro-r, shively-h, skilling-j, slinger-r, smith-m, solberg-g, south-s, staab-t,
      stclair-c, steffes-j, stepenovitch-j, stokley-c, storey-g, sturm-f, swerzbin-m, symes-k, taylor-m,
      tholt-j, thomas-p, townsend-j, tycholiz-b, ward-k, watson-k, weldon-c, whalley-g, whalley-l, white-s,
      whitt-m, williams-j, williams-w3, wolfe-j, ybarbo-p, zipper-a, zufferli-j]
    hf_repo: "MichaelR207/enron_qa_0922"
    hf_revision: "c0b3a9190fd970e83cfbe7d399a08860e43e221e"
    encoder: "Snowflake/snowflake-arctic-embed-m-v1.5"
    embed_batch_size: 64
    # 評価のテスト質問（受信箱あたり最大 20 問），公開情報の大きさを選ぶ dev，中央の分類器の学習用の train
    test_per_inbox: 20
    dev_per_inbox: 20
    train_per_inbox: 40
    # 他の受信箱にほぼ同じメール（Jaccard 0.9 以上）がある質問は主評価から除く
    duplicate_jaccard: 0.9
    # 回答に使うメールの数（EnronQA の原論文と同じ 5）
    k_context: 5
    owner_probe_per_inbox: 10
    # 公開情報の大きさ（Agent Card の件名の数・語のスケッチの語数 T・重心の数 C）．EQ2 で dev の MRR が最大の値
    # （results/20261009_eq2_advert_eval．journal の事前登録の規則）
    card_subjects: 40
    term_sketch_size: 200
    n_centroids: 32
    ragroute_negatives: 10
    # 自由記述の回答の判定モデル（質問者の llama3.1:8b と別系統）と，一致を測る参照モデル（p0004 §8.6）
    judge_model: "qwen3:8b"
    judge_reference_model: "qwen3:14b"
    judge_validate_n: 500
    judge_kappa_n: 300
