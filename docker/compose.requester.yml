# 質問者（GPU PC）の compose．scripts/remote/deploy.sh が ${ATRIUM_REMOTE_DIR}/ へ置く．
#   ollama    : 断片返却型で回答を生成する LLM（GPU）
#   requester : `docker compose run` で 1 回の実験ごとに起動する（scripts/remote/start.sh）
services:
  ollama:
    # 制御点の registry のミラーから取得し，モデルは deploy が ./ollama/models へ rsync で配る
    # （ノードのインターネット接続に頼らない）
    image: localhost:${REGISTRY_PORT}/mirror/ollama:${OLLAMA_TAG}
    restart: unless-stopped
    # root で動かすと ./ollama 以下が root の所有になり，deploy のモデルの rsync が書き込めなくなる
    user: "${HOST_UID}:${HOST_GID}"
    volumes:
      - ./ollama:/ollama
    # GPU は CDI（deploy.resources.reservations.devices）ではなく runtime: nvidia で渡す．
    # wafl500〜509 の一部は nvidia-ctk が無く，CDI での GPU の検出に失敗するため（expert-mesh の記録）
    runtime: nvidia
    environment:
      HOME: /ollama
      OLLAMA_MODELS: /ollama/models
      OLLAMA_KEEP_ALIVE: "-1"
      NVIDIA_VISIBLE_DEVICES: all

  requester:
    image: localhost:${REGISTRY_PORT}/atrium-full:latest
    profiles: ["run"]
    # 結果ファイルの所有者を SSH のユーザーにそろえる（制御点から rsync で回収するため）
    user: "${HOST_UID}:${HOST_GID}"
    runtime: nvidia
    environment:
      HOME: /tmp
      HF_HOME: /cache/huggingface
      # モデルは deploy が ./hf-cache へ配る（質問者のインターネット接続に頼らない）
      HF_HUB_OFFLINE: "1"
      NVIDIA_VISIBLE_DEVICES: all
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./placement.json:/app/placement.json:ro
      - ./data:/data:ro
      - ./results:/app/results
      - ./hf-cache:/cache/huggingface
    depends_on:
      - ollama
