# 専門家ノード（GPU なしの PC）の compose．scripts/remote/deploy.sh が各ノードの
# ${ATRIUM_REMOTE_DIR}/ へ .env とともに置き，`docker compose up -d` する．
#   ollama : 宿る型（local_answer）で使う CPU 推論の LLM
#   node   : シャードを読み込んで HTTP API を公開する専門家（atrium.node）
services:
  ollama:
    # 制御点の registry のミラーから取得し，モデルは deploy が ./ollama/models へ rsync で配る
    # （ノードのインターネット接続に頼らない）
    image: localhost:${REGISTRY_PORT}/mirror/ollama:${OLLAMA_TAG}
    restart: unless-stopped
    # root で動かすと ./ollama 以下が root の所有になり，deploy のモデルの rsync が書き込めなくなる
    user: "${HOST_UID}:${HOST_GID}"
    volumes:
      - ./ollama:/ollama
    environment:
      HOME: /ollama
      OLLAMA_MODELS: /ollama/models
      # 宿る型の連続した問い合わせのたびにモデルを読み直さないよう，起動中は保持する
      OLLAMA_KEEP_ALIVE: "-1"

  node:
    image: localhost:${REGISTRY_PORT}/atrium-node:latest
    restart: unless-stopped
    # シャードのディレクトリに書くキャッシュの所有者を SSH のユーザーにそろえる
    user: "${HOST_UID}:${HOST_GID}"
    command: ["atrium", "--config", "/app/config.yaml", "node", "--port", "8100"]
    ports:
      - "${NODE_PORT}:8100"
    environment:
      ATRIUM_NODE_ID: ${NODE_ID}
      ATRIUM_SHARDS_DIR: /shards
      ATRIUM_SHARD_IDS: ${SHARD_IDS}
      ATRIUM_OLLAMA_URL: http://ollama:11434
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      # 行の先頭位置のキャッシュ（*.offsets.npy）を書くので読み書き可能にする
      - ./shards:/shards
    depends_on:
      - ollama
