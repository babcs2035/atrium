# atrium: 組織内 PC に専門家として宿る LLM の分散協調の実験コード．
# 依存は役割ごとに分ける．専門家ノード（GPU なしの L480）は既定の依存だけで動き，
# 質問者・データ中継点（GPU PC）は `requester` extra で torch 等を追加する．
[project]
name = "atrium"
version = "0.1.0"
description = "Decentralized expert routing for federated RAG on organizational PCs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "numpy>=1.26,<2.3",
    "faiss-cpu>=1.9",
]

[project.optional-dependencies]
# 質問者（クエリ埋め込み・ルーター推論・再ランク）とデータ中継点（コーパス埋め込み・学習）で使う．
requester = [
    "torch>=2.4",
    "transformers>=4.45,<5",
    "sentence-transformers>=3.2,<4",
    "scikit-learn>=1.5",
    "huggingface-hub>=0.25",
    "pyarrow>=17",
]

[project.scripts]
atrium = "atrium.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atrium"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# 行長は ruff format が揃える．日本語の docstring・コメントは全角が幅 2 で数えられ，折り返すと読みにくいため除外する
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["atrium"]
mypy_path = "src"

# transformers の from_pretrained は型注釈を持たないため，それを呼ぶモジュールだけ untyped call を許す
[[tool.mypy.overrides]]
module = ["atrium.encoders"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["faiss", "faiss.*", "pyarrow", "pyarrow.*", "sentence_transformers", "sentence_transformers.*", "sklearn", "sklearn.*", "transformers", "transformers.*"]
ignore_missing_imports = true
