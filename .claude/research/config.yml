# research-cycle 設定: atrium
# サイクル全体の手順はグローバル skill（~/.claude/skills/research-cycle/SKILL.md）が規定する．
# ここにはこのリポジトリ固有の差分だけを書く．
#
# 【最初に読むもの】
#   - docs/d0006_research_overview.md（研究の概要・仕組み・理論・現状の要約）
#   - plans/p0001_initialization.md（研究計画書．RQ1〜RQ3，E0〜E5，成功条件，統計の方針）
#   - plans/p0002_implementation.md（実装計画．RAGRoute との差分の一覧）
#   - docs/d0001_architecture.md（役割の分担・データの流れ・API）
#   - docs/d0003_experiment_workflow.md（mise タスクの手順・所要時間・失敗時の確認先）
#
# 【恒久的な運用ルール】
#   1. 実験条件は config.yaml の値だけで決まる．レバーは原則として config.yaml の 1 キーを変える．
#      コードの変更が要るレバー（RQ1 の新しいルーティング方式など）は atrium.routing に Router を
#      1 個追加し，make_router() に登録した上で，config.yaml の experiment.routing でその名前を選ぶ．
#   2. 各ノードの操作は全て制御点 wafl-ctrl5 から行う（`ssh wafl-ctrl5`）．専門家は
#      192.168.13.100〜109・192.168.14.100〜109（GPU なし），質問者は制御点（wafl-ctrl5）である．
#      192.168.15.100〜109（wafl500〜509）は，データ準備の埋め込みを分担する GPU PC（cluster.gpu_workers）である．
  #      1 台のデバイスの役割は 1 つだけで，デバイスは config.yaml の cluster の requester・experts・gpu_workers に書く．
#   3. データ準備は 2026-10-06 に完了している（`mise run data-status` で確認できる）．作り直しには
#      制御点と wafl500〜509 の GPU で 6 時間以上かかるので，データ準備を中断・削除しない．
#      `retrieval.k_ret`・`k_rerank`・`cluster.shard_budget_gb`・`data.medrag.embed_precision` を変えると
#      ラベルやシャードの作り直しが要る（docs/d0002_configuration.md）．
#   4. 制御点のデータディレクトリ（/home/denjo/atrium-data）の削除，`mise run clean --full` は
#      人間の判断を要する（autonomy.destructive_requires_human）．
#   5. routing=all・merge=score・answer_mode=retrieval_only の実行では，analysis_report.md の
#      「ラベル一致」が 1.0 に近いことを必ず確認する．大きく下回るならシャードの配布か索引の誤りであり，
#      以降の比較は成立しない（ラベルは中継点で同じ埋め込みから計算しているため）．
#   6. 方式間の正答率の比較は，同じ質問集合に対する対応ありの検定（`uv run atrium compare A B`，
#      McNemar の正確検定）で行う．ルーターの評価は metrics.json の "test"（学習に使っていない質問）で行う．
#   7. `mise run deploy` は毎回イメージを build・push してから配る．`mise run start` は質問者の
#      config.yaml が今の config.yaml と違えば止まるので，config.yaml を変えたら必ず deploy からやり直す．
#      start は制御点で切り離して動くので，待機が切れても `mise run start <run_id>` で待ち直せる．
#   8. 単一の GPU を使う検証は，gpu2 ではなく制御点 wafl-ctrl5 で行う（gpu2 は B5 のとおりディスクの空きが少ない）．
#      実機の全構成（質問者 1 台と専門家 30 台）で確かめる必要があるレバーは，フルスペックの実機実験を行ってよい
#      （人間の指示 2026-10-14．データ・成果物の削除や課金を伴う操作は従来どおり人間の判断を要する）．

repo_name: atrium

tasks:
  setup:   "mise run setup"
  deploy:  "mise run deploy"
  run:     "mise run start"
  analyze: "mise run analyze"
  stop:    "mise run stop"           # 実験の後に実行してメモリと VRAM を解放する（削除はしない）
  clean:   "mise run clean"          # 破壊的（--full はノード上の成果物も削除）．自動実行しない

experiment:
  name_scheme: "Iter{n}"             # results/<YYYYMMDD_HHMMSS>/ を Iter{n} に対応付けて journal に記録する
  results_glob: "results/*/analysis_report.md"
  # 最新の実行の metrics.json を 1 行の JSON で出す（E0 の実行には metrics.json が無く，e0_summary.md を読む）
  metrics_cmd: "uv run atrium metrics --json"
  # MIRAGE 全 7,663 問の所要時間（2026-10-06 の実機での検証からの見積もり）:
  #   retrieval_only 約 4 時間（1 問あたり約 1.9 秒．各専門家が 1 シャードの検索に約 1.2 秒）
  #   snippet_return 約 14 時間（1 問あたり約 6.4 秒．質問者の llama3.1:8b の生成が律速）
  #   local_answer は専門家の CPU での生成が律速で，さらに長い（1 回 30〜190 秒）
  # 長い条件は question_limit で問題集ごとに絞った層化抽出で先に傾向を見ることを検討する
  timeout_min: 1200
  poll_interval_sec: 300

journal_retention: 3

# 単一レバー原則で振る候補（順序＝優先度）．1 イテレーションで動かすのは 1 つだけ．
# 研究計画書 §8 の E1 の順に並べた．E0 は準備段階で実施済み（journal.md 末尾の「準備段階の記録」と
# results/20261006_052434/e0_summary.md）．E2 以降（RQ1 の開集合ルーティングなど）は，E1 の再現が
# 成立してから，研究計画書 §5 の方式を Router として実装するレバーとして追記する．
levers:
  - {name: experiment.routing, values: [all],
     note: "E1-a．answer_mode=retrieval_only，merge=score．全データ源に問い合わせ，実機の統合結果と
            中継点のラベルの一致（ラベル一致）を確かめる．基盤の正しさの確認であり，以降の全比較の前提"}
  - {name: experiment.answer_mode, values: [snippet_return],
     note: "E1-b．routing=all のまま LLM で回答し，正答率を得る（RAGRoute の all 方式に当たる）"}
  - {name: experiment.routing, values: [ragroute, random, none],
     note: "E1-c．answer_mode=snippet_return のまま 3 方式を 1 イテレーションに 1 つずつ実行する．
            ragroute は test の質問で評価する．RAGRoute 論文の報告値（問い合わせ数の削減率・再現率）と
            比べ，差があれば原因（埋め込みの再計算・fp16・LLM の違い・ラベルの再計算）を切り分けて記録する"}
  - {name: retrieval.merge, values: [cross_encoder],
     note: "E1-d．RAGRoute の既定の再ランク（bge-reranker-v2-m3）での正答率．ラベル定義（スコアで統合）
            とは異なる点に注意"}
  - {name: experiment.dataset, values: [feb4rag],
     note: "E1-e．FeB4RAG の 13 エンジン．merge は qrels_oracle（RAGRoute で再ランクを無効にした場合と
            同じ），answer_mode は retrieval_only でデータ源選択の指標だけを取る（回答はペアワイズ評価が
            必要で，本基盤では未実装）"}
  - {name: experiment.routing, values: [card_sim],
     note: "E2（p0003 S5．実施済み）．MedRAG の desc_sim（自己紹介文の埋め込みの類似度）．routing.top_m.medrag = 3 の上位 3 源に
            問い合わせる．学習は使わない．answer_mode=retrieval_only・merge=score で，データ源選択の指標を ragroute（s5）・
            random（s6）の同じ test 4,599 問と比べ，top_doc_ids を s3 と比べる（結果は journal の「E2 の下流確認」）．
            後から加わったデータ源を見つける評価は実機を使わない `atrium loso`（journal の「E2：LOSO の判定」）"}
  - {name: data.enronqa.k_context, values: [1, 3, 5],
     note: "p0004 EQ8．EnronQA の文脈の通数．routing=oracle，answer_mode は snippet_return・local_answer．
            結果は journal の「EQ8〜EQ10」．B2'（CPU の専門家が qwen3:1.7b）は k = 3 と k = 5 の正答率に差がない"}
  - {name: experiment.routing, values: [centroid_probe],
     note: "Iteration 1 で追加（backlog B9 [auto-decided]）．multi_centroid の上位 K 個にだけ flood_score と同じ probe を送り，
            上位 m = 2 個を選ぶ二段の方式（selective search の資源選択＋打ち切りに当たる）．K は新しいキー routing.probe_k.enronqa で，
            dev で事前登録の規則で選ぶ．評価はオフライン（test 2,940 問の hit@2 と，クエリを受け取る受信箱の数）．
            退行の確認は K = 150 で flood_score，K = 2 で multi_centroid の hit@2 と一致すること"}
  - {name: owner_eval.input, values: [body_short],
     note: "Iteration 2 で追加（backlog B10 [human-decided]・B11・B12）．外部レビュー R1．T2（owner-eval）の短い入力を，ヘッダー込みの先頭 28 トークン（E_short）から
            区切り線より後の本文の先頭 28 トークン（E_body_short．Subject は含めない）へ変える．新しい CLI atrium header-eval でオフラインに評価し，
            term_sketch の特徴語に占めるヘッダー依存の語の割合（R1 (a)）と，質問文の人名の有無で分けた hit（R2）を追加の集計として出す．config.yaml は変えない"}
  - {name: advert_eval.input, values: [body_only],
     note: "Iteration 2 の評価で追加（backlog B14 [auto-decided]）．Iteration 3 の rc-researcher が確定（backlog B15）：設定キーではなく新しいオフライン評価 CLI `atrium body-advert-eval`
            （src/atrium/body_advert_eval.py）として実装し，config.yaml は変えない．card_sim は件名だけの公開情報なので変えずに対照とする．
            EnronQA の公開情報（card_sim・term_sketch・centroid_sim・multi_centroid）を，ヘッダー込みのメールではなく区切り線より後の本文（Subject なし）から作り直し，
            EQ2 と同じ test 2,940 問の hit@1・hit@2 と，所有者の特定（E と E_body_short）を測り直す．EQ2 で選んだ大きさ（件名 40，T = 200，C = 32）は固定する（card_sim は件名を使うので扱いを事前登録で決める）．
            flood_score・ラベル・シャードは変えない．hit は持ち主の姓を含む問（R2 の A 群）とそれ以外に分けて出す．オフライン評価で，既存の Advert と results は消さない"}
  - {name: experiment.routing, values: [centroid_probe],
     note: "Iteration 3 の評価で追加（backlog B17 [auto-decided]）．centroid_probe の実機化．質問者の 2 段目（multi_centroid の上位 K = 75 の受信箱だけへの probe）を実装し，
            T4 と同じ条件（EnronQA 300 問，retrieval_only，parallel 1・4・8・16・30 × 3 回）で e2e の待ち時間・処理量を flood_score・multi_centroid（T4）と比べる．
            1 段目はシャードにある既存のヘッダー込みの multi_centroid（C = 32）．1 問あたりに届くデバイスの数と受信箱の数を記録し，上位 K の再現率と K ごとのデバイスの数の分布をオフラインで出す．
            既存の routing の値の挙動は変えない．フルスペックの実機実験（運用ルール 8）"}
  - {name: experiment.http_pool, values: [per_node, shared_unlimited],
     note: "Iteration 4 の評価で追加（backlog B19 [auto-decided]）．Iteration 5 の rc-researcher がキー名と値を確定（backlog B20）．既定は shared（今の挙動）．
            per_node は mounts でノードの origin ごとに別の池（上限 64），shared_unlimited は 1 つの池のまま上限なし．判定の主は per_node．事前登録は journal の Iteration 5．Iteration 4 で，parallel 30 の待ちはノードの計算（probe の時間の 0.1% 未満）ではなく質問者の側の HTTP の扱いにあると読めた．
            全ノードで共有する 1 つの httpx.AsyncClient（max_connections = 512．src/atrium/experiment.py）を，律速の候補（接続の池の管理・池の上限による接続の作り直し）を外す形
            （ノードごとの AsyncClient，または池の上限を同時の要求の数より大きくする．形は rc-researcher が事前登録で決める）に変え，flood_score・centroid_probe（K = 75）・multi_centroid を
            T4 と同じ 300 問・検索だけで測り直す．質問者の CPU 使用率，requester.log の retrying の数，ノードの access log の接続の数も記録する．既存の方式の選択の挙動は変えない"}
  - {name: requester.advert_scoring, values: [precomputed],
     note: "Iteration 5 の評価で追加（backlog B21 [auto-decided]）．仮称．Iteration 5 は採用（per_node で flood_score の parallel 30 が 5.09 倍）．per_node の下では multi_centroid・centroid_probe の処理量は
            1 段目の採点（route_s 約 0.111 秒）で決まっており，その主因は MultiCentroidRouter.score が問ごと・受信箱ごとに重心のリストを np.asarray で変換していることと読める（操作端末で 0.105 秒 → 前計算で 0.001 秒）．
            重心を公開情報の読み込み時に numpy の行列として前計算し，選択は変えずに（selected_sources が全問一致），experiment.http_pool: per_node を明示して multi_centroid・centroid_probe（K = 75，K = 30 は記録）を
            300 問・検索だけ・parallel 1/4/16/30 × 3 回で Iteration 5 の per_node の値と比べる．Iteration 6 の rc-researcher が確定（backlog B22）：設定キーではなくコードの置き換え
            （SourceProfile.advert_centroids に読み込み時に前計算し，MultiCentroidRouter.score がそれを使う）．config.yaml は変えない．事前登録は journal の Iteration 6．
            次の候補はデバイスを単位に上位を選ぶ方式，その後に複数の質問者のプロセスの構成"}
  - {name: experiment.routing, values: [device_probe],
     note: "Iteration 6 の評価で追加（backlog B23 [auto-decided]）．仮称．Iteration 6 は採用（route_s 0.111 → 0.0015 秒，parallel 30 の処理量 multi_centroid 169.5・K = 30 19.7・K = 75 13.4 問/秒）．
            質問者が 1 コアで律速の間は処理量が 1 問あたりの要求の数で決まり（R ≈ 420 要求/秒），K = 75 は probe が 29.1 台に届くので flood_score と同じ程度にしかならない．
            1 段目（前計算した multi_centroid の採点）の受信箱の得点をデバイスごとにまとめ，上位 D 台にだけ probe を送って上位 m = 2 個を選ぶ二段の方式．まとめ方と D は rc-researcher が事前登録で決める．
            まずオフラインで test の hit@2 と 1 問あたりの probe のデバイスの数を centroid_probe（K = 30・75）と比べ，見込みのある D を実機（per_node，300 問・検索だけ）で測る．既存の routing の値の挙動は変えない．
            Iteration 7 の rc-researcher が確定（backlog B24）：`experiment.routing: device_probe` と新しいキー `routing.probe_d.enronqa`，まとめ方は最大値．D は `atrium device-probe-eval` の dev で事前登録の規則で選ぶ．事前登録は journal の Iteration 7．
            次の候補は複数の質問者のプロセス・デバイスの構成（専門家の側の限界の測定）．Iteration 7 は採用（parallel 30 の処理量 dp24 15.64 対 cp75 12.82，dp12 30.75 対 cp30 19.53 問/秒）"}
  - {name: experiment.requester_procs, values: [2, 4, 8],
     note: "Iteration 7 の評価で追加（backlog B25 [auto-decided]）．仮称．Iteration 4〜7 の負荷の比較は全て質問者 1 プロセス（1 コアに張り付き，R ≈ 390〜440 要求/秒）の能力の比較で，専門家の側の限界は測れていない．
            同じ制御点 wafl-ctrl5（12 コア）の上で，問を N 個の質問者のプロセスに分けて同時に流す（追加だけの設定キー．既定 1 ＝今の挙動）．flood_score と device_probe（D = 24・12）を per_node・検索だけで測り，
            N に対して処理量が比例して伸びるか，頭打ちのときに質問者と専門家のどちらの CPU が張り付くかを記録する．キー名・N・parallel の割り方・問の数・判定の規則は rc-researcher が事前登録で決める．
            質問者を複数のデバイスに置く形（cluster.requester の形式とデバイスの役割の変更）は人間の判断に残す（B25 (a)）．
            Iteration 8 の rc-researcher が確定（backlog B26）：キーは `experiment.requester_procs`（既定 1）．N ∈ {1, 2, 4, 8}，parallel は合計 30 で固定して各プロセスへ割る．test の全 2,940 問．
            専門家の CPU はノードの /healthz の process_cpu_s，制御点の CPU は /proc/stat で測る．判定の主は flood_score の N = 2 対 N = 1．事前登録は journal の Iteration 8"}

# ベースライン条件（環境変数ではなく config.yaml の値で切り替える）
baselines:
  - {name: rag_none, config: {experiment.routing: none}, note: "RAG なし（LLM 単体）"}
  - {name: rag_all, config: {experiment.routing: all}, note: "全データ源に問い合わせる"}

success_criteria: "E0: e0_summary.md の全表が埋まり，専門家側のモデル規模と断片数 k を数値の根拠付きで決められること．
  E1: (1) routing=all・merge=score・retrieval_only でラベル一致 ≥ 0.99，(2) ragroute の test での
  データ源選択の再現率と問い合わせ数の削減率が RAGRoute 論文の報告値と同程度であること（差は原因を特定して記録する）．
  方式間の正答率の差は McNemar の正確検定で p < 0.05 のときだけ差があるとみなす"

